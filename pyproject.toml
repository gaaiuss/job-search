# ============================
# Warning: Python version must be consistant between:
#   - project.requires-python
#   - tool.ruff.target-version
#   - tool.pyright.pythonVersion
#
# Warning: Package name must be consistant between:
#   - project.scripts
#   - tool.ruff.lint.isort.known-first-party
#   - The folder inside 'src/'
# ============================
[project]
authors = [{name = "gaaiuss", email = "caio.gui.castro@gmail.com"}]
dependencies = [
  "python-dotenv>=1.1.0",
  "rich>=15.0.0",
  "selenium>=4.50.0",
]
description = "job-search"
license = "MIT"
name = "job-search"
readme = "README.md"
requires-python = ">=3.14"
version = "0.0.1"

[project.optional-dependencies]
dev = ["ruff", "pyright", "pytest", "pytest-xdist"]

# ============================
# Linting and auto format (Ruff)
# ============================
[tool.ruff]
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]
fix = true
indent-width = 4
line-length = 88
show-fixes = true
target-version = "py314"

[tool.ruff.lint]
ignore = [
  "T201", # Checks for print statements.
  "INP001", # Checks for packages that are missing an __init__.py file.
  "D", # All pydocstyle (D)
  "ANN401", # Checks that function arguments are annotated with a more specific type than Any.
  "ERA001", # Checks for commented-out Python code.
  "A004", # Shadowing Python Builtin.
  "CPY001", # Missing copyright notice at top of file.
  "DTZ005", # `datetime.datetime.now()` called without a `tz` argument
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint.isort]
# Teaches Ruff what is the main package of the project.
# It must be the same name of the folder inside the 'src/'.
known-first-party = ["my_package"]

# ============================
# Typing (Pyright)
# ============================
[tool.pyright]
exclude = [
  "**/.*",
  "**/venv",
  "**/.venv",
  "**/env",
  "**/.env",
  "**/node_modules",
  "**/__pycache__",
]
executionEnvironments = [{root = "src"}]
include = ["src", 'tests']
pythonVersion = "3.14"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

# Disabled rules
# reportMissingTypeStubs = "none" # Missing stubs file
reportUnknownMemberType = "none" # Type of parameter partially unknown

# ============================
# Tests (Pytest)
# ============================
[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
# Add 'src' to Python path during tests. This allows the tests in `tests/` 
# to import the modules in `src/` without errors.
pythonpath = ["src"]
testpaths = ["tests"]

# ============================
# Build and Setuptools
# ============================
[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[tool.setuptools.packages.find]
# Informs setuptools to find the packages inside 'src' folder.
# Essential for layout structure 'src/'.
where = ["src"]

[tool.setuptools]
# Maps the root folder to 'src'.
package-dir = {"" = "src"}
